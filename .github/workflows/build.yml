name: Build GLASS TV APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3

      - name: Create GLASS TV project files
        run: |
          set -e
          mkdir -p GLASS-TV
          cd GLASS-TV

          cat << 'EOF_GLASS' > settings.gradle
          include ':app'
          rootProject.name = 'GLASS-TV'
          EOF_GLASS

          cat << 'EOF_GLASS' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF_GLASS

          cat << 'EOF_GLASS' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF_GLASS

          mkdir -p app/src/main/java/com/iptv/glass
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values

          cat << 'EOF_GLASS' > app/build.gradle
          apply plugin: 'com.android.application'

          android {
              namespace 'com.iptv.glass'
              compileSdk 34

              defaultConfig {
                  applicationId "com.iptv.glass"
                  minSdk 21
                  targetSdk 22
                  versionCode 2
                  versionName "2.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF_GLASS

          cat << 'EOF_GLASS' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />

              <application
                  android:allowBackup="true"
                  android:label="GLASS TV"
                  android:theme="@style/AppTheme">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="landscape"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.HOME" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".DetailActivity"
                      android:exported="false"
                      android:screenOrientation="landscape" />
              </application>
          </manifest>
          EOF_GLASS

          cat << 'EOF_GLASS' > app/src/main/res/values/styles.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar" />
          </resources>
          EOF_GLASS

          cat << 'EOF_GLASS' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#121212">

              <Button
                  android:id="@+id/openDetailBtn"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="center"
                  android:text="GLASS TV - Open Detail" />
          </FrameLayout>
          EOF_GLASS

          cat << 'EOF_GLASS' > app/src/main/res/layout/activity_detail.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#1E1E1E">

              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_gravity="center"
                  android:text="GLASS TV Detail Screen"
                  android:textColor="#FFFFFF"
                  android:textSize="22sp" />
          </FrameLayout>
          EOF_GLASS

          cat << 'EOF_GLASS' > app/src/main/java/com/iptv/glass/MainActivity.java
          package com.iptv.glass;

          import android.content.Intent;
          import android.os.Bundle;
          import android.widget.Button;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);

                  Button btn = findViewById(R.id.openDetailBtn);
                  btn.setOnClickListener(v -> {
                      Intent intent = new Intent(MainActivity.this, DetailActivity.class);
                      startActivity(intent);
                  });
              }
          }
          EOF_GLASS

          cat << 'EOF_GLASS' > app/src/main/java/com/iptv/glass/DetailActivity.java
          package com.iptv.glass;

          import android.os.Bundle;
          import androidx.appcompat.app.AppCompatActivity;

          public class DetailActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_detail);
              }
          }
          EOF_GLASS

          gradle wrapper --gradle-version 8.4 --distribution-type bin
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GLASS-TV-debug-apk
          path: GLASS-TV/app/build/outputs/apk/debug/app-debug.apk
